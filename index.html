<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════
         SEO — GOOGLE
         ═══════════════════════════════════════════════ -->

    <!-- Título: palavra-chave + localidade + especialidades (≤ 60 chars) -->
    <title>Marlon Inácio — Advogado em Brasília | Penal, Administrativo e Civil</title>

    <!-- Descrição: aparece no snippet do Google (≤ 160 chars) -->

      name="description"
      content="Marlon Inácio, advogado OAB/DF 87.696 em Brasília. Atuação em Direito Penal, Administrativo e Civil e consultoria preventiva. Primeira conversa pelo WhatsApp."
    />

    <!-- Palavras-chave: localidade + especialidades + nome -->
    <meta
      name="keywords"
      content="advogado Brasília, advogado DF, direito penal Brasília, defesa criminal DF, direito administrativo Brasília, processo administrativo DF, advogado civil Brasília, contratos, Marlon Inácio advogado, OAB DF 87696, São Sebastião DF, consultoria jurídica Brasília"
    />

    <!-- Robots: indexar e seguir links -->
    <meta name="robots" content="index, follow" />

    <!-- Autor -->
    <meta name="author" content="Marlon Luiz Inácio da Silva – OAB/DF 87.696" />

    <link rel="canonical" href="https://advogado-marlon.vercel.app" />

    <!-- ═══════════════════════════════════════════════
         OPEN GRAPH — WhatsApp, Facebook, LinkedIn
         ═══════════════════════════════════════════════ -->
    <meta property="og:type"        content="website" />
    <meta property="og:locale"      content="pt_BR" />
    <meta property="og:site_name"   content="Dr. Marlon Inácio – Advogado" />
    <meta property="og:url"         content="https://advogado-marlon.vercel.app" />
    <meta property="og:title"       content="Marlon Inácio — Advogado em Brasília | Penal, Administrativo e Civil" />
    <meta property="og:description" content="Advogado OAB/DF 87.696 em Brasília. Atuação em Direito Penal, Administrativo e Civil e consultoria preventiva. Primeira conversa pelo WhatsApp." />
    <!-- URL absoluta obrigatória para WhatsApp/LinkedIn buscarem a imagem -->
    <meta property="og:image"       content="https://advogado-marlon.vercel.app/preview.png" />
    <meta property="og:image:alt"   content="Dr. Marlon Inácio – Advogado OAB/DF 87.696 – Brasília" />
