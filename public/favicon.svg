<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Marlon Inácio — Advogado">
  <!-- Fundo verde-tinta (cor de marca) -->
  <rect width="64" height="64" fill="#1E4D3B"/>
  <!-- Anel de latão discreto — sobrevive ao recorte circular do avatar -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#B9975A" stroke-width="1.5" opacity="0.7"/>
  <!-- Monograma MI -->
  <text x="32" y="38.5" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Libre Baskerville', serif"
        font-weight="700" font-size="27" letter-spacing="0.5" fill="#F6F5F1">MI</text>
  <!-- Fio de latão sob o monograma — eco das divisórias do site -->
  <rect x="24" y="45" width="16" height="2" fill="#B9975A"/>
</svg>
